<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width"><title>MX browser regression QA</title><style>body{font:14px system-ui;margin:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{width:100%;height:600px;border:1px solid #ddd}</style></head><body><h1>Mexico automated browser QA mxqa2</h1><pre id="report">RUNNING — wait for COMPLETE</pre><iframe id="target" title="Mexico preview"></iframe><script>
(async()=>{
const report=document.getElementById('report'),frame=document.getElementById('target'),rows=[],errors=[],sleep=ms=>new Promise(r=>setTimeout(r,ms));
let w,d,clipboard='',downloads=[],blobs=new Map();
const log=()=>{report.textContent=rows.map(x=>x[0]+' '+x[1]+(x[2]?' — '+x[2]:'')).join('\n')};
async function test(name,fn){try{const v=await fn();if(v===false)throw Error('assertion false');rows.push(['PASS',name,typeof v==='string'?v:'']);}catch(e){rows.push(['FAIL',name,String(e.message||e)]);}log()}
function check(x,m){if(!x)throw Error(m)}
const $=s=>d.querySelector(s),id=s=>d.getElementById(s),click=s=>{const e=$(s);check(e,'missing '+s);check(!e.disabled,'disabled '+s);e.click();return e},tab=s=>click('.lf-tab[data-tab="'+s+'"]'),set=(el,v)=>{el.focus();el.value=v;el.setSelectionRange?.(v.length,v.length);el.dispatchEvent(new w.Event('input',{bubbles:true}));};
async function until(fn,ms=6000){let t=Date.now();while(Date.now()-t<ms){if(fn())return;await sleep(100)}throw Error('timeout')}
async function sig(blob){return Array.from(new Uint8Array(await blob.slice(0,8).arrayBuffer())).map(x=>x.toString(16).padStart(2,'0')).join('')}
const sample='Niño mexicano á é í ó ú ü Ñ 🇲🇽 <b> &';
try{
const loaded=new Promise((resolve,reject)=>{frame.onload=resolve;setTimeout(()=>reject(Error('iframe load timeout')),18000)});
frame.src='/letras-bonitas.html?qa=mxqa2';await loaded;w=frame.contentWindow;d=w.document;
w.addEventListener('error',e=>errors.push(String(e.message||e.filename)));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
try{Object.defineProperty(w.navigator,'clipboard',{configurable:true,value:{writeText:async t=>{clipboard=String(t)}}})}catch(e){}
const orig=w.URL.createObjectURL.bind(w.URL);w.URL.createObjectURL=b=>{const u=orig(b);blobs.set(u,b);return u};const origClick=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){if(this.download){downloads.push({name:this.download,blob:blobs.get(this.href),href:this.href});return;}return origClick.call(this)};
w.confirm=()=>true;w.alert=m=>errors.push('alert: '+m);
await test('Preview revision + SEO',()=>{check(d.documentElement.lang==='es-MX','lang');check($('meta[name=robots]')?.content==='noindex,nofollow','robots');check($('link[rel=canonical]')?.href==='https://www.levenshtein.net/letras-bonitas','canonical');check(Array.from(d.scripts).some(s=>s.src.includes('text-writer-mx3.js?v=mxqa2')),'stale deployment');JSON.parse($('script[type="application/ld+json"]').textContent);return d.title});
await test('4 tabs switch',()=>{for(const t of ['writer','quick','bio','pro']){tab(t);check(id('view-'+t).classList.contains('active'),t)}});
await test('Quick input Unicode and safe text',()=>{tab('quick');set(id('quick-input'),sample);check(id('quick-grid').__fsdRawValue===sample,'raw lost');check(id('quick-grid').querySelectorAll('.lf-font-item').length>=300,'fonts');check(!id('quick-grid').querySelector('b'),'unescaped HTML');return id('quick-grid').querySelectorAll('.lf-font-item').length+' fonts'});
await test('Quick copy exact payload (clipboard stub)',async()=>{clipboard='';click('#quick-copy');await until(()=>clipboard===sample);});
await test('Quick font copy full long text (clipboard stub)',async()=>{const v='Niño 🇲🇽 '.repeat(85);set(id('quick-input'),v);clipboard='';click('#quick-grid .lf-font-item');await until(()=>clipboard.length>360);check(id('quick-grid').__fsdRawValue===v,'raw source truncated')});
await test('Aesthetic output + locks',async()=>{set(id('quick-input'),'Luna México');click('#fsd-aesthetic-generate');await until(()=>id('fsd-aesthetic-output').textContent.trim().length>0&&!id('fsd-aesthetic-result').hidden);const v=id('fsd-aesthetic-output').textContent;const old=id('fsd-lock-font').getAttribute('aria-pressed');click('#fsd-lock-font');check(old!==id('fsd-lock-font').getAttribute('aria-pressed'),'lock');clipboard='';click('#fsd-aesthetic-copy');await until(()=>clipboard===v);return 'generated and copied'});
await test('Bio input, preview, count and copy',async()=>{tab('bio');set(id('bio-input'),sample);check(id('bio-preview').textContent===sample,'preview');check(id('bio-count').textContent===Array.from(sample).length+'/150','count '+id('bio-count').textContent);clipboard='';click('#bio-copy');await until(()=>clipboard===sample);});
await test('Bio clear',()=>{click('#bio-clear');check(id('bio-input').value===''&&id('bio-preview').textContent==='','not clear')});
await test('Game Unicode, score and matrix',()=>{tab('pro');set(id('lf194-input'),'Niño 🇲🇽');check(id('lf194-preview').textContent==='Niño 🇲🇽','preview');check(id('lf194-b-blacklist').textContent.includes('no verificada'),'misleading availability');click('#lf194-btn-matrix');check(!!$('#lf194-matrix-wrap table'),'matrix missing');click('#lf194-btn-matrix');});
await test('Game random and clipboard',async()=>{const old=id('lf194-input').value;click('#lf194-btn-random');const v=id('lf194-input').value;check(v&&v!==old,'no change');clipboard='';click('#lf194-btn-copy');await until(()=>clipboard===v);});
await test('Game icon picker',()=>{click('#lf194-btn-icon-picker');check(id('lf194-icon-grid').children.length>0,'empty icon grid');click('#lf194-icon-close')});
await test('Game certificate PNG bytes',async()=>{click('#lf194-btn-cert');await until(()=>id('lf194-cert-modal').classList.contains('lf-open'));const canvas=id('lf194-cert-canvas');check(canvas.width>0&&canvas.height>0,'canvas');const n=downloads.length;click('#lf194-cert-dl');await until(()=>downloads.length>n);const f=downloads.at(-1);check(f.name.endsWith('.png')&&f.blob&&await sig(f.blob)==='89504e470d0a1a0a','invalid PNG');click('#lf194-cert-close');return f.blob.size+' bytes'});
await test('Game clear',()=>{click('#lf194-btn-clear');check(id('lf194-input').value===''&&id('lf194-preview').textContent==='','not clear')});
await test('Writer Spanish input and draft',async()=>{tab('writer');const e=id('tw-editor');set(e,sample);await sleep(300);check(e.value===sample,'input mismatch');check(JSON.parse(w.localStorage.getItem('tw-draft-es-mx-v2')).text===sample,'draft mismatch');});
await test('Writer immediate undo and redo',async()=>{const e=id('tw-editor');set(e,'Niño primero');await sleep(310);set(e,'Niño segundo');click('#tw-btn-undo');check(e.value==='Niño primero','undo '+e.value);click('#tw-btn-redo');check(e.value==='Niño segundo','redo '+e.value)});
await test('Writer uppercase, lowercase Spanish',()=>{const e=id('tw-editor');set(e,'niño áéíóúü');click('#tw-us-upper');check(e.value==='NIÑO ÁÉÍÓÚÜ','upper '+e.value);click('#tw-us-lower');check(e.value==='niño áéíóúü','lower '+e.value)});
await test('Writer selected-font transform and normalize',()=>{const e=id('tw-editor');set(e,'Hola Mundo');e.setSelectionRange(0,4);click('#tw-btn-fonts');const styles=[...d.querySelectorAll('.tw-font-item:not(.tw-font-normal)')];check(styles.length>0,'font modal');styles[0].click();check(e.value.endsWith(' Mundo'),'unselected text changed');check(e.value!=='Hola Mundo','style unchanged');e.setSelectionRange(0,e.value.length-6);click('#tw-btn-fonts');click('.tw-font-normal');check(e.value==='Hola Mundo','normalize '+e.value)});
await test('Writer symbol insertion',()=>{const e=id('tw-editor');set(e,'A');click('#tw-btn-symbols');const b=$('#tw-symbols-modal .tw-sym-btn');check(b,'symbol missing');const symbol=b.textContent;b.click();check(e.value==='A'+symbol+' ','symbol insertion '+e.value)});
await test('Writer exact clipboard payload (stub)',async()=>{set(id('tw-editor'),sample);clipboard='';click('#tw-btn-copy');await until(()=>clipboard===sample)});
await test('Writer PNG generation and download bytes',async()=>{click('#tw-btn-save-image');check(id('tw-export-modal').classList.contains('open'),'export modal');click('#tw-btn-export-download');await until(()=>id('tw-result-modal').classList.contains('open'),12000);check(w._twResultPages?.[0]?.startsWith('data:image/png'),'PNG output');const n=downloads.length;click('#tw-result-download');await until(()=>downloads.length>n);const f=downloads.at(-1);check(f.blob&&await sig(f.blob)==='89504e470d0a1a0a','bad PNG');click('#tw-result-close');return f.blob.size+' bytes'});
await test('Writer DOCX export content',async()=>{click('#tw-btn-save-image');const n=downloads.length;click('#tw-btn-export-docx');await until(()=>downloads.length>n,14000);const f=downloads.at(-1);check(f.name.endsWith('.docx')&&f.blob,'missing docx');const zip=await w.JSZip.loadAsync(f.blob);const xml=await zip.file('word/document.xml').async('string');check(xml.includes('Niño mexicano')&&xml.includes('&lt;b&gt;'),'bad escaped document');return f.blob.size+' bytes'});
await test('Writer PDF export signature',async()=>{click('#tw-btn-export-styled-pdf');await until(()=>w._lastGeneratedDocBlob&&w._lastGeneratedDocKind==='pdf',12000);const b=w._lastGeneratedDocBlob;check((await sig(b)).startsWith('25504446'),'bad PDF');click('#tw-result-close');return b.size+' bytes'});
await test('Responsive width 390px, four tabs',async()=>{frame.style.width='390px';await sleep(400);const bad=[];for(const t of ['quick','bio','pro','writer']){tab(t);await sleep(80);const root=id('lf194-root');if(root.scrollWidth>root.clientWidth+3)bad.push(t+':'+root.scrollWidth+'/'+root.clientWidth)}check(!bad.length,bad.join(', '));return 'iframe viewport '+w.innerWidth});
await test('Runtime exceptions after initialization',()=>{check(!errors.length,errors.join('; '));});
}catch(e){rows.push(['FAIL','Harness setup',String(e.message||e)])}
log();report.textContent+='\nCOMPLETE '+rows.filter(x=>x[0]==='PASS').length+'/'+rows.length+' PASS. Clipboard and OS download intercepted; no physical mobile keyboard/microphone test.';
})();
</script></body></html>
