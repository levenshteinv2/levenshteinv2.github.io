name: Thai live Preview acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/th-preview-acceptance.yml'
permissions:
  contents: read
jobs:
  live-th:
    if: github.head_ref == 'preview/th-2026-11-26' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live HTTP byte equality and MIME
        run: |
          python - <<'PY'
          import hashlib, pathlib, time, urllib.request
          root=pathlib.Path('.')
          files=[root/'akson-phiset.html']+sorted(p for p in (root/'assets/tools/th/v1').rglob('*') if p.is_file())
          assert len(files)==29
          origin='https://levenshteinv2.github.io/'
          def verify(p):
              route='akson-phiset' if p.name=='akson-phiset.html' else p.as_posix()
              req=urllib.request.Request(origin+route,headers={'User-Agent':'Levenshtein V2 acceptance QA','Accept-Encoding':'identity','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  data=r.read()
                  assert r.status==200 and r.geturl().startswith(origin)
                  mime=r.headers.get_content_type()
                  if p.suffix=='.woff2': assert mime=='font/woff2',mime
                  if p.suffix=='.js': assert mime in ('application/javascript','text/javascript'),mime
                  assert hashlib.sha256(data).digest()==hashlib.sha256(p.read_bytes()).digest(),route
              print('HTTP_BYTE_PASS',route,len(data),mime,flush=True)
          for n in range(15):
              try: verify(files[0]);break
              except Exception as e:
                  print('Waiting for Pages propagation:',repr(e),flush=True)
                  if n==14:raise
                  time.sleep(10)
          for p in files[1:]:verify(p)
          print('TH_LIVE_HTTP 29/29 PASS release 87819a507e799fe57428da80f34d8def9991ad37')
          PY
      - name: Prepare browser
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-dejavu fonts-noto-core
          python -m pip install Pillow pypdf
      - name: Live functional and export acceptance
        env:
          QA_ORIGIN: https://levenshteinv2.github.io
        run: |
          export CHROME_BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node .github/th-preview-suite.mjs . "$RUNNER_TEMP/qa-th-live"
          python .github/th-preview-exports.py "$RUNNER_TEMP/qa-th-live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: th-live-acceptance
          path: ${{ runner.temp }}/qa-th-live/
          retention-days: 7
