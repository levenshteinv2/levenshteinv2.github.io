name: Metadata staging QA
on:
  push:
    branches: ['staging/metadata-20261126']
    paths: ['.github/workflows/metadata-staging.yml']
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install beautifulsoup4==4.13.3 playwright==1.51.0
      - run: python .github/metadata-qa/apply.py
      - run: QA_MODE=static python .github/qa/audit.py
      - run: cp qa-report/report.json .github/metadata-qa/site-static-results.json
      - name: Commit metadata-only staging
        run: |
          test "$GITHUB_REF_NAME" = 'staging/metadata-20261126'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add .github/metadata-qa/
          git commit -m 'Optimize and validate metadata for all 91 knowledge pages'
          git push origin HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-qa
          path: .github/metadata-qa/
          include-hidden-files: true
