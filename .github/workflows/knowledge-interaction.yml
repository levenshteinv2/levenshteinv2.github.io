name: Knowledge V2 targeted repair and UX audit
on:
  push:
    branches: ['qa/knowledge-interaction-20261125']
    paths: ['.github/workflows/knowledge-interaction.yml']
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4==4.13.3 playwright==1.51.0
      - if: always()
        run: python -m playwright install --with-deps chromium firefox
      - name: Test navigation, keyboard, TOC and Firefox timeout
        if: always()
        run: |
          python -u - <<'PY'
          import asyncio,json,threading,os
          from pathlib import Path
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.async_api import async_playwright
          from urllib.parse import unquote
          names=json.loads(Path('.github/qa/pages.json').read_text())
          class Handler(SimpleHTTPRequestHandler):
              def translate_path(self,path):
                  p=super().translate_path(path)
                  return p+'.html' if not os.path.exists(p) and os.path.isfile(p+'.html') else p
              def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          origin=f'http://127.0.0.1:{server.server_port}'
          results=[]
          async def run():
              async with async_playwright() as pw:
                  for engine,work in [('chromium',[(p,390) for p in names]+[(p,1440) for p in ['index.html','algorithms.html','glossary.html','approximate-edit-distance-algorithms.html','about.htm']]),('firefox',[('about.htm',390)])]:
                      browser=await getattr(pw,engine).launch()
                      sem=asyncio.Semaphore(4)
                      async def check(name,w):
                          async with sem:
                              result=dict(page=name,engine=engine,width=w,checks=[],issues=[])
                              c=await browser.new_context(viewport={'width':w,'height':844 if w==390 else 900})
                              await c.route('**/*',lambda r:r.continue_() if r.request.url.startswith(origin+'/') else r.abort())
                              page=await c.new_page()
                              page.set_default_timeout(4500)
                              try:
                                  r=await page.goto(origin+'/'+name,wait_until='domcontentloaded',timeout=15000)
                                  assert r and r.ok,'HTTP'
                                  result['checks'].append('HTTP')
                                  menus=page.locator('.ux-primary > details')
                                  assert await menus.count()==2,'primary menus missing'
                                  first=menus.nth(0).locator('summary');second=menus.nth(1).locator('summary')
                                  await first.click()
                                  assert await menus.nth(0).evaluate('(e)=>e.open'),'first menu did not open'
                                  await second.click()
                                  await page.wait_for_function("document.querySelectorAll('.ux-primary > details[open]').length===1")
                                  assert await menus.nth(1).evaluate('(e)=>e.open'),'second menu did not open'
                                  await page.keyboard.press('Escape')
                                  await page.wait_for_function("document.querySelectorAll('.ux-primary > details[open]').length===0")
                                  assert await second.evaluate('(e)=>document.activeElement===e'),'Escape did not restore focus'
                                  await first.focus();await page.keyboard.press('Enter')
                                  await page.wait_for_function("document.querySelector('.ux-primary > details').open")
                                  await page.keyboard.press('Escape')
                                  result['checks'].append('primary menus and keyboard')
                                  skip=page.locator('.ux-skip')
                                  if await skip.count():
                                      await skip.focus();await page.keyboard.press('Enter')
                                      assert await page.locator('#ux-main').evaluate('(e)=>document.activeElement===e'),'skip focus not moved'
                                      result['checks'].append('skip link')
                                  toc=page.locator('.ux-outline')
                                  if await toc.count():
                                      if not await toc.evaluate('(e)=>e.open'):await toc.locator('summary').click()
                                      a=toc.locator('a[href^="#"]').first
                                      if await a.count():
                                          target=unquote((await a.get_attribute('href'))[1:])
                                          await a.click()
                                          assert unquote(await page.evaluate('location.hash'))=='#'+target,'TOC click hash'
                                          assert await page.evaluate('(id)=>!!document.getElementById(id)',target),'TOC target absent'
                                          result['checks'].append('TOC click')
                                  side=page.locator('.ux-side-menu')
                                  if await side.count():
                                      before=await side.evaluate('(e)=>e.open')
                                      await side.locator(':scope > summary').click()
                                      assert await side.evaluate('(e)=>e.open')!=before,'sidebar toggle'
                                      result['checks'].append('sidebar toggle')
                                      await side.locator(':scope > summary').click()
                                      assert await side.evaluate('(e)=>e.open')==before,'sidebar restore'
                                      if not before:await side.locator(':scope > summary').click()
                                      sub=side.locator('.ux-research').first
                                      if await sub.count():
                                          state=await sub.evaluate('(e)=>e.open')
                                          await sub.locator(':scope > summary').click()
                                          assert await sub.evaluate('(e)=>e.open')!=state,'subtopic toggle'
                                          result['checks'].append('subtopic toggle')
                                  result['checks'].append('no horizontal overflow')
                                  assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth+2'),'horizontal overflow'
                              except Exception as e:result['issues'].append(str(e)[:500])
                              finally:
                                  results.append(result)
                                  await c.close()
                                  if result['issues']:print('UX ISSUE',json.dumps(result),flush=True)
                      await asyncio.gather(*(check(p,w) for p,w in work))
                      await browser.close()
          asyncio.run(run())
          out=Path('qa-report');out.mkdir(exist_ok=True)
          (out/'interaction.json').write_text(json.dumps(results,indent=2))
          print('UX SUMMARY',json.dumps(dict(expected=97,completed=len(results),passed=sum(not r['issues'] for r in results),checks=sum(len(r['checks']) for r in results))))
          if len(results)!=97 or any(r['issues'] for r in results):raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-targeted-qa
          path: qa-report/
          retention-days: 7
