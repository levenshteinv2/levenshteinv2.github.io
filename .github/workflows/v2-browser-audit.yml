name: V2 isolated link and accessibility audit
on:
  push:
    branches: [qa/ui-v2-browser-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - run: node qa/link-access-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-link-access-audit
          path: qa/link-results/
