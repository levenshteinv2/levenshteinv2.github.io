name: Schema core staging QA
on:
  push:
    branches: ['staging/schema-core-20261126']
    paths: ['.github/workflows/schema-core-staging.yml']
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install beautifulsoup4==4.13.3 playwright==1.51.0
      - run: python .github/schema-qa/apply.py
      - run: QA_MODE=static python .github/qa/audit.py
      - run: cp qa-report/report.json .github/schema-qa/site-static-results.json
      - name: Commit isolated schema change set
        run: |
          test "$GITHUB_REF_NAME" = 'staging/schema-core-20261126'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add .github/schema-qa/
          git commit -m 'Normalize reviewed shared schema definitions and page descriptions'
          git push origin HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-core-qa
          path: .github/schema-qa/
          include-hidden-files: true
