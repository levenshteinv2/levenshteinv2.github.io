name: Spain OPT2 regression and live deployment verification
on:
  push:
    branches: ['qa/es-2026-11-25']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Run 20 browser regression groups
        run: node tests/es-browser-regression.mjs
      - name: Verify deployed route and exact file bytes
        run: |
          set -euo pipefail
          dir=assets/tools/es/v20.9.7-opt2-candidate
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 25 -w 'HTTP %{http_code} EFFECTIVE %{url_effective}\n' https://levenshteinv2.github.io/generador-de-letras -o /tmp/es-live.html && cmp generador-de-letras.html /tmp/es-live.html; then break; fi
            sleep 10
          done
          cmp generador-de-letras.html /tmp/es-live.html
          for asset in unicode-engine.js tool-core-es1.js text-writer-es1.js aesthetic-engine.js localizacion-eses1.js jszip-3.10.1.js; do
            curl --fail --silent --show-error --location --max-time 30 "https://levenshteinv2.github.io/$dir/$asset" -o "/tmp/$asset"
            cmp "$dir/$asset" "/tmp/$asset"
            echo "MATCH $asset"
          done
      - run: node tests/es-live-smoke.mjs
