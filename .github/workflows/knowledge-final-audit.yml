name: Knowledge final entity and live route audit
on:
  push:
    branches: ['qa/knowledge-interaction-20261125']
    paths: ['.github/workflows/knowledge-final-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4==4.13.3 playwright==1.51.0
      - name: Entity graph and published route coverage
        run: |
          python -u - <<'PY'
          import json,collections,concurrent.futures,urllib.request
          from urllib.parse import urlsplit
          from pathlib import Path
          from bs4 import BeautifulSoup
          pages=json.loads(Path('.github/qa/pages.json').read_text())
          assert len(pages)==91 and len(set(pages))==91
          issues=[]; nodes=set(); refs=[]; kinds=collections.Counter(); social=collections.Counter()
          base='https://www.levenshtein.net'
          def walk(x,p):
              if isinstance(x,dict):
                  i=x.get('@id')
                  if isinstance(i,str):
                      if len(x)>1:nodes.add(i)
                      elif i.startswith(base+'/'):refs.append((p,i))
                  t=x.get('@type')
                  if t:
                      for v in (t if isinstance(t,list) else [t]):kinds[v]+=1
                  for v in x.values():walk(v,p)
              elif isinstance(x,list):
                  for v in x:walk(v,p)
          soups={}
          for p in pages:
              s=BeautifulSoup(Path(p).read_text(),'html.parser');soups[p]=s
              for tag in s.select('script[type="application/ld+json"]'):walk(json.loads(tag.get_text()),p)
              for field in ['twitter:site','twitter:creator']:
                  t=s.find('meta',attrs={'name':field})
                  if t and '.' in t.get('content',''):social[field]+=1
          for p,i in sorted(set(refs)):
              if i not in nodes:issues.append(dict(page=p,kind='unresolved_local_schema_id',detail=i))
          print('ENTITY SUMMARY',json.dumps(dict(pages=len(pages),schema_ids=len(nodes),references=len(set(refs)),types=kinds,unresolved=len(issues),unverified_social_handles=social)))
          for x in issues[:50]:print('ENTITY ISSUE',json.dumps(x))
          def route(p):
              s=soups[p]
              can=s.select_one('link[rel=canonical]')['href']
              path=urlsplit(can).path
              urls=list(dict.fromkeys(['https://levenshteinv2.github.io'+path,'https://levenshteinv2.github.io/'+p]))
              out=[]
              for url in urls:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'LevenshteinV2-QA/1.0'})
                      with urllib.request.urlopen(req,timeout=12) as r:
                          doc=BeautifulSoup(r.read(),'html.parser')
                          c=doc.select_one('link[rel=canonical]');robots=doc.select_one('meta[name=robots]')
                          good=(r.status==200 and c and c.get('href')==can and robots and 'noindex' in robots.get('content','').lower())
                          out.append(dict(page=p,url=url,status=r.status,passed=bool(good),bytes=len(str(doc).encode())))
                  except Exception as e:out.append(dict(page=p,url=url,passed=False,error=str(e)))
              return out
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              results=[r for group in ex.map(route,pages) for r in group]
          print('LIVE SUMMARY',json.dumps(dict(pages=len(pages),routes=len(results),passed=sum(x['passed'] for x in results))))
          for x in results:
              if not x['passed']:print('LIVE ISSUE',json.dumps(x))
          out=Path('qa-report');out.mkdir(exist_ok=True)
          (out/'entity-live.json').write_text(json.dumps(dict(entity_issues=issues,types=kinds,social=social,routes=results),indent=2))
          if any(not x['passed'] for x in results):raise SystemExit(1)
          PY
      - if: always()
        run: python -m playwright install --with-deps chromium
      - name: Preview browser performance sample
        if: always()
        run: |
          python -u - <<'PY'
          import json,statistics
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          urls=['/','/algorithms','/glossary','/approximate-edit-distance-algorithms','/paper-levenshtein-1966']
          results=[]
          with sync_playwright() as p:
              b=p.chromium.launch()
              for path in urls:
                  c=b.new_context(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
                  page=c.new_page()
                  page.add_init_script("""window.__qaPerf={lcp:0,cls:0};try{new PerformanceObserver(l=>{for(const e of l.getEntries())window.__qaPerf.lcp=e.startTime}).observe({type:'largest-contentful-paint',buffered:true});new PerformanceObserver(l=>{for(const e of l.getEntries())if(!e.hadRecentInput)window.__qaPerf.cls+=e.value}).observe({type:'layout-shift',buffered:true})}catch(e){}""")
                  bad=[]
                  page.on('response',lambda r:bad.append({'url':r.url,'status':r.status}) if r.status>=400 else None)
                  try:
                      page.goto('https://levenshteinv2.github.io'+path,wait_until='load',timeout=20000)
                      page.wait_for_timeout(1000)
                      m=page.evaluate("""()=>{const n=performance.getEntriesByType('navigation')[0];return {lcp_ms:Math.round(window.__qaPerf.lcp),cls:window.__qaPerf.cls,ttfb_ms:Math.round(n.responseStart),dom_ms:Math.round(n.domContentLoadedEventEnd),load_ms:Math.round(n.loadEventEnd),resources:performance.getEntriesByType('resource').length,transfer_bytes:n.transferSize+performance.getEntriesByType('resource').reduce((a,r)=>a+r.transferSize,0)}}""")
                      results.append(dict(path=path,**m,failed_http=bad))
                  except Exception as e:results.append(dict(path=path,error=str(e)))
                  finally:c.close()
              b.close()
          print('PERF SAMPLE',json.dumps(results))
          out=Path('qa-report');out.mkdir(exist_ok=True);(out/'perf.json').write_text(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-final-qa
          path: qa-report/
          retention-days: 7
