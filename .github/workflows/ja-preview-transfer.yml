name: Japanese live Preview acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ja-preview-transfer.yml'
permissions:
  contents: read
jobs:
  live-ja:
    if: github.head_ref == 'preview/ja-2026-11-25' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual HTTP bytes and font MIME
        run: |
          python - <<'PY'
          import hashlib, pathlib, time, urllib.request
          root=pathlib.Path('.')
          files=[root/'font-henkan.html']+sorted((root/'assets/tools/ja/v1').rglob('*'))
          files=[p for p in files if p.is_file()]
          assert len(files)==23
          origin='https://levenshteinv2.github.io/'
          def verify(p):
              route='font-henkan' if p.name=='font-henkan.html' else p.as_posix()
              req=urllib.request.Request(origin+route,headers={'User-Agent':'Levenshtein V2 acceptance QA','Accept-Encoding':'identity','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  data=r.read()
                  assert r.status==200
                  assert r.geturl().startswith(origin)
                  mime=r.headers.get_content_type()
                  if p.suffix=='.woff2': assert mime in ('font/woff2','application/font-woff2','application/octet-stream'),mime
                  if p.suffix=='.js': assert mime in ('application/javascript','text/javascript'),mime
                  assert hashlib.sha256(data).digest()==hashlib.sha256(p.read_bytes()).digest(),route
              print('HTTP_BYTE_PASS',route,len(data),mime,flush=True)
          for n in range(12):
              try: verify(files[0]);break
              except Exception as e:
                  print('Waiting for Pages propagation:',repr(e),flush=True)
                  if n==11:raise
                  time.sleep(10)
          for p in files[1:]: verify(p)
          print('JA_LIVE_HTTP 23/23 PASS release 528b3f6539411d1629164ddd7460d6a4ac0fafb3')
          PY
      - name: Prepare browser
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow pypdf
      - name: Live functional and export acceptance
        env:
          QA_ORIGIN: https://levenshteinv2.github.io
        run: |
          export CHROME_BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node .github/ja-preview-suite.mjs . "$RUNNER_TEMP/qa-ja-live"
          python .github/ja-preview-exports.py "$RUNNER_TEMP/qa-ja-live"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ja-live-acceptance
          path: ${{ runner.temp }}/qa-ja-live/
          retention-days: 7
